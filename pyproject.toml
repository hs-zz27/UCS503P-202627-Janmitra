[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "janmitra-docs"
version = "0.1.0"
description = "Janmitra course documentation tooling; runtime packages live under code"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6,<2", "mkdocs-material>=9.6", "mkdocstrings[python]>=0.28",
  "mkdocs-literate-nav>=0.6", "mkdocs-section-index>=0.3",
  "mkdocs-git-revision-date-localized-plugin>=1.3",
  "pymdown-extensions>=10.14",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
cache_dir = ".janmitra/pytest-cache"
pythonpath = ["code/backend"]
testpaths = ["code/backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
