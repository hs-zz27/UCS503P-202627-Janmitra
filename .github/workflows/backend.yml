name: backend

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janmitra
          POSTGRES_PASSWORD: janmitra
          POSTGRES_DB: janmitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janmitra -d janmitra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JANMITRA_TEST_DATABASE_URL: postgresql+asyncpg://janmitra:janmitra@localhost:5432/janmitra_test
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/pyproject.toml
      - run: pip install -e ".[dev,voice,gemini]"
      - run: ruff check .
      - run: pytest
